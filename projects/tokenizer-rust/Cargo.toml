[package]
name = "tokenizer-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
# Pour la CLI
clap = { version = "4.5", features = ["derive"] }
# Pour la sérialisation du vocabulaire
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Pour la normalisation Unicode
unicode-normalization = "0.1"

[dev-dependencies]
# Pour les tests
criterion = "0.5"
